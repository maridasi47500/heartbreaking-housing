{% extends 'base.html' %}
{% block content %}
<form enctype="multipart/form-data" method="POST">
    <div class="field"><label for="somefieldcity_id">city_id</label>
        <select name="city_id" id="somefieldcity_id">
            {% for city in cities %}
            <option value="{{ city['id'] }}">{{ city['name'] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field"><label for="somefieldname">name</label><input type="text" id="somefieldname" name="name"/></div>
    <div class="actions"><input type="submit"/></div>
</form>
{% for x in teas %}{{ x["name"] }} {% endfor %}
{% endblock %}
{% block liens %}
<a href="/">bienvenue</a><a href="/add_one_tea"> add one tea</a>
{% endblock %}
